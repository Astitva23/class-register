<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Class Register</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app-shell">

  <header class="header">
    <h1 class="brand">CLASS REGISTER</h1>
    <div id="user-badge" class="user-badge hidden">
      <span id="user-name"></span>
      <button id="logout-btn" class="text-btn">Sign out</button>
    </div>
  </header>

  <!-- AUTH -->
  <section id="auth-section" class="page">
    <div class="auth-card">
      <div class="tabs">
        <button class="tab active" data-tab="login" type="button">Sign in</button>
        <button class="tab" data-tab="signup" type="button">Join the class</button>
      </div>

      <form id="login-form" class="auth-form">
        <label>User ID
          <input type="text" id="login-username" autocomplete="username" required />
        </label>
        <label>Password
          <input type="password" id="login-password" autocomplete="current-password" required />
        </label>
        <button type="submit" class="btn btn-primary full-width">Sign in</button>
      </form>

      <form id="signup-form" class="auth-form hidden">
        <label>Your name
          <input type="text" id="signup-name" required />
        </label>
        <label>Pick a User ID
          <input type="text" id="signup-username" autocomplete="username" required pattern="[a-zA-Z0-9_.]{3,20}" title="3-20 letters, numbers, underscores or dots" />
        </label>
        <label>Pick a password
          <input type="password" id="signup-password" autocomplete="new-password" required minlength="6" />
        </label>
        <button type="submit" class="btn btn-primary full-width">Join class</button>
      </form>

      <p id="auth-error" class="error hidden"></p>
      <p class="note">Any User ID works — no email required.</p>
    </div>
  </section>

  <!-- APP -->
  <section id="app-section" class="page hidden">
    <div class="calendar-card">
      <div class="month-nav">
        <button id="prev-month" class="text-btn" type="button">&larr;</button>
        <h2 id="month-label"></h2>
        <button id="next-month" class="text-btn" type="button">&rarr;</button>
      </div>

      <div class="weekday-row">
        <span>SUN</span><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span>
      </div>

      <div class="calendar-grid" id="calendar-grid"></div>

      <p class="legend">
        <span class="dot dot-green"></span> ATTENDING
        <span class="dot dot-red"></span> NOT ATTENDING
        <span class="dot dot-yellow"></span> NOT SURE
        <span class="dot dot-event"></span> EVENT
      </p>
    </div>
  </section>
</div>

<!-- Bottom sheet -->
<div id="sheet-backdrop" class="sheet-backdrop hidden"></div>
<div id="day-sheet" class="day-sheet hidden">
  <div class="sheet-handle"></div>
  <button id="close-sheet" class="text-btn close-sheet-btn" type="button">CLOSE</button>
  <h3 id="sheet-date" class="sheet-title"></h3>

  <div class="sheet-block">
    <div class="sheet-block-header">
      <h4>IMPORTANT EVENTS</h4>
      <button id="open-add-event" class="btn btn-small btn-primary" type="button">+ ADD EVENT</button>
    </div>
    <ul id="events-list" class="events-list"></ul>
  </div>

  <div class="sheet-block">
    <div class="sheet-block-header">
      <h4>DAILY NOTES</h4>
      <label class="btn btn-small btn-primary file-btn">
        + ADD PHOTO
        <input type="file" id="note-photo-input" accept="image/*" hidden />
      </label>
    </div>
    <div class="note-tabs">
      <button class="note-tab active" data-subject="Physics" type="button">PHYSICS</button>
      <button class="note-tab" data-subject="Chemistry" type="button">CHEMISTRY</button>
      <button class="note-tab" data-subject="English" type="button">ENGLISH</button>
    </div>
    <div id="notes-photo-grid" class="notes-photo-grid"></div>
    <p id="notes-upload-status" class="upload-status hidden"></p>
  </div>

  <div class="sheet-block">
    <h4>YOUR STATUS</h4>
    <div class="status-buttons">
      <button id="mark-attending" class="btn btn-status btn-green" type="button">ATTENDING</button>
      <button id="mark-not-attending" class="btn btn-status btn-red" type="button">NOT ATTENDING</button>
      <button id="mark-not-sure" class="btn btn-status btn-yellow" type="button">NOT SURE</button>
    </div>
  </div>

  <div class="sheet-block">
    <h4>ATTENDANCE STATUS</h4>
    <div class="status-columns">
      <div class="status-col">
        <div class="status-col-header col-green">ATTENDING</div>
        <ul id="list-attending" class="status-name-list"></ul>
      </div>
      <div class="status-col">
        <div class="status-col-header col-red">NOT ATTENDING</div>
        <ul id="list-not-attending" class="status-name-list"></ul>
      </div>
      <div class="status-col">
        <div class="status-col-header col-yellow">NOT SURE</div>
        <ul id="list-not-sure" class="status-name-list"></ul>
      </div>
    </div>
  </div>
</div>

<!-- Add event modal -->
<div id="event-modal-backdrop" class="modal-backdrop hidden"></div>
<div id="event-modal" class="modal hidden">
  <h3>ADD EVENT</h3>
  <form id="event-form">
    <label>Category
      <select id="event-category" required>
        <option value="" disabled selected>Select category</option>
        <option>C.T</option>
        <option>Copy submission</option>
        <option>Test</option>
        <option>Practical</option>
        <option>Extracurricular</option>
      </select>
    </label>
    <label>Subject
      <select id="event-subject" required>
        <option value="" disabled selected>Select subject</option>
        <option>English</option>
        <option>Chemistry</option>
        <option>Physics</option>
        <option>Maths</option>
        <option>Optional</option>
        <option>No subject</option>
      </select>
    </label>
    <label id="event-name-field" class="hidden">Event name
      <input type="text" id="event-name" placeholder="e.g. Debate club meetup" />
    </label>
    <div class="modal-actions">
      <button type="button" id="cancel-event" class="btn btn-ghost">CANCEL</button>
      <button type="submit" class="btn btn-primary">ADD EVENT</button>
    </div>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
